name: Deploy demo to GitHub Pages

# Builds the React dashboard and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://nani42346.github.io/fine-tuning-koti-ai-coding/

on:
  push:
    branches: [main]
    paths:
      - "frontend/coding-ai-ui/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/coding-ai-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/coding-ai-ui/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: false
      - name: Publish build/ to gh-pages branch
        working-directory: frontend/coding-ai-ui/build
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy dashboard demo from ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
